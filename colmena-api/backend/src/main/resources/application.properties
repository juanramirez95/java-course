spring.application.name=colmena-api
server.port=8080

# ---------- Base de datos ----------
# Crea la base vacia colmena_db en pgAdmin antes de arrancar.
# ${DB_PASSWORD:postgres} = usa la variable de entorno DB_PASSWORD; si no existe, usa "postgres".
spring.datasource.url=jdbc:postgresql://localhost:5432/colmena_db
spring.datasource.username=postgres
spring.datasource.password=544695

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- JWT ----------
# La clave debe tener al menos 32 caracteres. En produccion va en una variable de entorno.
jwt.secret=${JWT_SECRET:colmena-coworking-clave-secreta-de-desarrollo-2026}
jwt.expiration=86400000

# ---------- Swagger ----------
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
